name: Deploy to VPS

# Dispara o deploy na VPS a cada push no master. O runner do GitHub nao baixa
# nem builda nada: ele so avisa a VPS (via SSH com "forced command") pra ela
# puxar o codigo do proprio GitHub, buildar e reiniciar o pm2. Ver
# /home/danfe/deploy/run.sh na VPS e atualizar.md neste repo.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar deploy na VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # A chave tem "forced command" na VPS: so consegue rodar o
          # /home/danfe/deploy/run.sh, nada mais — nao precisa (nem pode)
          # passar outro comando aqui.
          ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key danfe@187.127.45.197
