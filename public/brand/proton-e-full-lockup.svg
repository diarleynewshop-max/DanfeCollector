<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="white"/>

  <!-- Minimal atom / proton mark -->
  <g fill="none" stroke="#000" stroke-width="22" stroke-linecap="round">
    <ellipse cx="600" cy="480" rx="285" ry="125" transform="rotate(-34 600 480)"/>
    <ellipse cx="600" cy="480" rx="285" ry="125" transform="rotate(34 600 480)"/>
  </g>

  <!-- Nucleus -->
  <circle cx="600" cy="480" r="42" fill="#000"/>

  <!-- Electron -->
  <circle cx="825" cy="335" r="27" fill="#000"/>

  <!-- Wordmark -->
  <text x="600" y="835"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112"
        font-weight="700"
        letter-spacing="2"
        fill="#000">PROTON-<tspan font-weight="400">e</tspan></text>
</svg>
